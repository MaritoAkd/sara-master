<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  html { height:100%; width:100%; overflow:hidden; }
  body { height:100%; width:100%; overflow:visible; position:relative;
    font-family:"Segoe UI","Rajdhani",sans-serif; color:#cfe9fb;
    background:radial-gradient(ellipse at 50% 60%, #0a1424 0%, #060b16 45%, #03060c 100%); }
  body::before { content:""; position:fixed; inset:0; pointer-events:none; opacity:.5;
    background-image: linear-gradient(rgba(80,150,210,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(80,150,210,.05) 1px, transparent 1px); background-size:48px 48px; }
  body::after { content:""; position:fixed; left:50%; top:38%; width:60vmin; height:60vmin; transform:translate(-50%,-50%); border-radius:50%; pointer-events:none; z-index:0;
    background:radial-gradient(circle, rgba(80,160,230,.12), transparent 70%); animation:halo 6s ease-in-out infinite; }
  @keyframes halo { 0%,100%{opacity:.6;} 50%{opacity:1;} }

  #avatarWrap { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); width:min(38vh,360px); height:min(38vh,360px); z-index:10; pointer-events:none; overflow:visible; }
  #reactor { width:100%; height:100%; position:relative; overflow:visible; }
  #core { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:22%; height:22%; border-radius:50%;
    background:radial-gradient(circle, rgba(180,230,255,.95) 0%, rgba(80,170,240,.7) 35%, rgba(40,100,180,.15) 70%, transparent 100%);
    box-shadow:0 0 30px rgba(100,200,255,.7), 0 0 60px rgba(70,160,230,.35); z-index:4; }
  .p { position:absolute; left:50%; top:50%; border-radius:50%; background:rgba(160,220,255,.8); box-shadow:0 0 4px rgba(120,210,255,.7); pointer-events:none; z-index:3; }
  .p.p1 { width:4px; height:4px; animation:float1 8s ease-in-out infinite; }
  .p.p2 { width:3px; height:3px; animation:float2 11s ease-in-out infinite .7s; }
  .p.p3 { width:5px; height:5px; animation:float3 14s ease-in-out infinite 1.4s; opacity:.6; }
  .p.p4 { width:3px; height:3px; animation:float4 9s ease-in-out infinite 2.1s; }
  .p.p5 { width:4px; height:4px; animation:float5 12s ease-in-out infinite .3s; opacity:.7; }
  body.speaking .p { background:rgba(200,240,255,1); box-shadow:0 0 8px rgba(160,230,255,.9); }
  body.speaking #core { box-shadow:0 0 50px rgba(120,220,255,1), 0 0 100px rgba(80,180,255,.6); }
  @keyframes float1 { 0%,100%{transform:translate(0,0);} 25%{transform:translate(60px,-30px);} 50%{transform:translate(80px,20px);} 75%{transform:translate(30px,50px);} }
  @keyframes float2 { 0%,100%{transform:translate(0,0);} 25%{transform:translate(-50px,40px);} 50%{transform:translate(-70px,-10px);} 75%{transform:translate(-20px,-60px);} }
  @keyframes float3 { 0%,100%{transform:translate(0,0);} 33%{transform:translate(40px,50px);} 66%{transform:translate(-50px,30px);} }
  @keyframes float4 { 0%,100%{transform:translate(0,0);} 33%{transform:translate(-60px,-40px);} 66%{transform:translate(20px,-70px);} }
  @keyframes float5 { 0%,100%{transform:translate(0,0);} 50%{transform:translate(70px,10px);} }

  #subs { position:absolute; left:50%; bottom:18vh; transform:translateX(-50%); max-width:56vw; text-align:center; font-size:16px; line-height:1.5;
    color:rgba(220,240,255,.92); pointer-events:none; z-index:2; background:transparent; padding:4px 14px; border:none;
    text-shadow:0 1px 6px rgba(0,0,0,.7); letter-spacing:.3px; transition:opacity .3s ease; opacity:0; }
  #subs.show { opacity:1; }

  #status { position:absolute; top:3.5vh; left:50%; transform:translateX(-50%); font-size:11px; letter-spacing:4px; color:rgba(140,195,230,.55); text-transform:uppercase; pointer-events:none; z-index:2; text-shadow:0 0 10px rgba(0,0,0,.8); }
  #hint { position:absolute; top:3.5vh; right:2vw; font-size:9.5px; letter-spacing:2px; color:rgba(150,200,235,.4); pointer-events:none; z-index:2; }

  .panel { position:absolute; z-index:3; background:linear-gradient(160deg,rgba(10,17,30,.88),rgba(7,12,22,.85)); border:1px solid rgba(120,180,220,.25); border-radius:14px; padding:13px 15px;
    backdrop-filter:blur(12px); box-shadow:0 4px 35px rgba(40,100,160,.15), inset 0 0 25px rgba(40,90,140,.04); }
  .panelTitle { display:flex; justify-content:space-between; align-items:center; font-size:9.5px; letter-spacing:3px; text-transform:uppercase; color:rgba(150,200,235,.6); margin-bottom:7px; border-bottom:1px solid rgba(120,180,220,.15); padding-bottom:5px; cursor:grab; }
  .panelTitle .dot { cursor:pointer; color:rgba(255,120,120,.0); transition:color .2s; padding:0 4px; }
  .panel:hover .panelTitle .dot { color:rgba(255,120,120,.6); }
  .panelTitle .dot:hover { color:#ff6b6b; }
  .dragging { cursor:grabbing !important; }

  #stats { right:2vw; bottom:4vh; width:250px; font-size:11.5px; line-height:1.7; }
  .bar { height:4px; background:rgba(255,255,255,.07); border-radius:2px; overflow:hidden; margin:2px 0 6px; }
  .bar > i { display:block; height:100%; background:linear-gradient(90deg,#4fc3f7,#81d4fa); transition:width .6s ease; }
  #tokLine { margin-top:4px; padding-top:5px; border-top:1px solid rgba(120,180,220,.15); }

  #feed { left:2vw; top:50%; transform:translateY(-50%); width:280px; max-height:64vh; overflow:hidden auto; scrollbar-width:none; }
  #feed::-webkit-scrollbar{display:none;}
  #feedSearch { display:flex; gap:5px; margin-bottom:8px; }
  #feedSearchInput { flex:1; min-width:0; background:rgba(255,255,255,.05); border:1px solid rgba(120,180,220,.25); border-radius:12px; padding:5px 10px; color:#eaf4fb; font-size:11px; outline:none; user-select:text; }
  #feedSearchInput:focus { border-color:rgba(140,210,255,.5); }
  #feedSearchBtn { border:1px solid rgba(120,180,220,.3); background:rgba(90,170,230,.12); color:#cfe9fb; border-radius:10px; padding:0 10px; cursor:pointer; font-size:11px; white-space:nowrap; }
  #feedSearchBtn:hover { background:rgba(90,170,230,.28); }
  #feedList li { list-style:none; padding:6px 0; border-bottom:1px solid rgba(120,180,220,.08); }
  #feedList a { color:rgba(159,216,255,.92); text-decoration:none; font-size:11.5px; line-height:1.45; display:block; cursor:pointer; }
  #feedList a:hover { color:#fff; text-shadow:0 0 8px rgba(140,210,255,.6); }

  #controls { position:absolute; bottom:4vh; left:50%; transform:translateX(-50%); z-index:4; display:flex; align-items:center; gap:14px; }
  #textInput { background:transparent; border:none; border-bottom:1px solid rgba(120,180,220,.35); color:#fff; font-size:16px; padding:6px 0; width:260px; outline:none; transition:border-color .2s; letter-spacing:.3px; }
  #textInput:focus { border-bottom-color:rgba(140,210,255,.7); }
  #textInput::placeholder { color:rgba(140,195,230,.4); font-style:italic; }
  #micBtn { width:44px; height:44px; border-radius:50%; border:1px solid rgba(120,180,220,.25); background:transparent; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .2s, transform .15s; }
  #micBtn:hover { border-color:rgba(140,210,255,.6); transform:scale(1.08); }
  #micBtn.active { border-color:rgba(120,255,200,.6); transform:scale(1.12); }
  #micBtn svg { fill:rgba(159,216,255,.85); }

  #reader { position:absolute; inset:0; z-index:10; display:none; background:rgba(3,6,12,.72); backdrop-filter:blur(6px); }
  #reader.open { display:flex; align-items:center; justify-content:center; }
  #readerBox { width:min(58vw,720px); max-height:80vh; display:flex; flex-direction:column; background:linear-gradient(160deg,rgba(10,17,30,.96),rgba(7,12,22,.94)); border:1px solid rgba(120,180,220,.3); border-radius:16px; padding:18px 22px; box-shadow:0 8px 60px rgba(40,100,160,.25); }
  #readerTitle { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; border-bottom:1px solid rgba(120,180,220,.15); padding-bottom:8px; }
  #readerLabel { font-size:10px; letter-spacing:3px; text-transform:uppercase; color:rgba(150,200,235,.65); }
  #readerClose { cursor:pointer; color:rgba(150,200,235,.6); font-size:15px; padding:0 6px; }
  #readerClose:hover { color:#ff6b6b; }
  #searchRow { display:flex; gap:8px; margin-bottom:12px; }
  #searchInput { flex:1; background:rgba(255,255,255,.05); border:1px solid rgba(120,180,220,.25); border-radius:16px; padding:7px 14px; color:#eaf4fb; font-size:12.5px; outline:none; user-select:text; }
  #searchBtn { border:1px solid rgba(120,180,220,.3); background:rgba(90,170,230,.12); color:#cfe9fb; border-radius:14px; padding:0 16px; cursor:pointer; font-size:12px; }
  #searchBtn:hover { background:rgba(90,170,230,.28); }
  #resultsList { list-style:none; margin-bottom:10px; }
  #resultsList li { padding:5px 0; border-bottom:1px solid rgba(120,180,220,.08); }
  #resultsList a { color:#9fd8ff; text-decoration:none; font-size:12px; cursor:pointer; }
  #resultsList a:hover { color:#fff; }
  #articleBody { overflow-y:auto; font-size:13.5px; line-height:1.75; color:rgba(234,244,251,.92); scrollbar-width:thin; scrollbar-color:rgba(120,180,220,.3) transparent; white-space:normal; user-select:text; }

  #loadMsg { position:absolute; left:50%; top:38%; transform:translate(-50%,-50%); font-size:11px; letter-spacing:3px; text-transform:uppercase; color:rgba(140,195,230,.5); z-index:1; pointer-events:none; }

  body.web #stats, body.web #feed { display:none !important; }
  body.web #hint { display:none; }
  body.web { display:flex; flex-direction:column; align-items:center; padding-top:8px; gap:0; }
  body.web #status, body.web #hint { position:static; transform:none; margin:0 auto; order:1; }
  body.web #loadMsg { top:38%; }
  body.web #avatarWrap { position:relative; left:auto; top:auto; transform:none; width:min(56vw,340px); height:min(70vw,430px); order:2; }
  body.web #controls { position:relative; left:auto; bottom:auto; transform:none; order:3; margin:12px 0; }
  body.web #reader { position:fixed; }
</style>
</head>
<body>
  <div id="status">SARA · MODO MAESTRO</div>
  <div id="hint">CTRL+ALT+S SALIR</div>
  <div id="loadMsg">iniciando reactor…</div>
  <div id="avatarWrap"><div id="reactor"><div id="core"></div><div class="p p1"></div><div class="p p2"></div><div class="p p3"></div><div class="p p4"></div><div class="p p5"></div></div></div>
  <div id="subs"></div>

  <div class="panel" id="feed" data-panel>
    <div class="panelTitle"><span>Radar tech</span><span class="dot" data-close="feed">✕</span></div>
    <div id="feedSearch"><input id="feedSearchInput" placeholder="Buscar..." /><button id="feedSearchBtn">Ir</button></div>
    <ul id="feedList"><li style="color:rgba(150,200,235,.4)">cargando…</li></ul>
  </div>

  <div class="panel" id="stats" data-panel>
    <div class="panelTitle"><span>Sistema</span><span class="dot" data-close="stats">✕</span></div>
    <div>CPU <span id="cpuPct">—</span>%</div>
    <div class="bar"><i id="cpuBar" style="width:0%"></i></div>
    <div>RAM <span id="ramPct">—</span>% de <span id="ramGb">—</span> GB</div>
    <div class="bar"><i id="ramBar" style="width:0%"></i></div>
    <div>Uptime <span id="upH">—</span>h · <span id="cores">—</span> núcleos</div>
    <div id="tokLine">ox-alpha ▸ in <span id="tIn">0</span> / out <span id="tOut">0</span></div>
  </div>

  <div id="controls">
    <input id="textInput" placeholder="Escribí o hablale a Sara..." />
    <button id="micBtn" title="empujar para hablar">
      <svg width="22" height="22" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
    </button>
  </div>

  <div id="reader">
    <div id="readerBox">
      <div id="readerTitle"><span id="readerLabel">Lector</span><span id="readerClose">✕</span></div>
      <ul id="resultsList"></ul>
      <div id="articleBody"></div>
    </div>
  </div>

<script>
  if (!window.sara) {
    const post = (url, body) => fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body||{}) }).then(r => r.json());
    const get = (url) => fetch(url).then(r => r.json());
    window.sara = {
      stats: () => get("/api/stats"), feed: () => get("/api/feed"), search: (q) => get("/api/search?q=" + encodeURIComponent(q)),
      article: (u) => get("/api/article?u=" + encodeURIComponent(u)), open: () => {},
      ask: async (text) => { const r = await post("/api/ask", { text }); if (!r.ok) throw new Error(r.error || "error");
        if (r.audioB64 && window.__onWebAudio) window.__onWebAudio({ audioB64: r.audioB64, text: r.reply }); return { reply: r.reply, tokens: r.tokens || { prompt:0, completion:0 } }; },
      onToken: (cb) => { window.__onWebToken = cb; }, onAudio: (cb) => { window.__onWebAudio = cb; }, onStatus: (cb) => { window.__onWebStatus = cb; },
    };
    document.body.classList.add("web");
    console.log("[sara] modo web shim");
  }
</script>
<script>
  const $ = (id) => document.getElementById(id);
  const micBtn = $("micBtn");
  const textInput = $("textInput");
  $("loadMsg").style.display = "none";

  let busy = false, speakingNow = false, _ctx = null;
  const audioQueue = [];

  function getSharedCtx() {
    if (!_ctx || _ctx.state === "closed") { _ctx = new AudioContext({ sampleRate: 24000 }); console.log("[sara] AudioContext creado:", _ctx.state); }
    if (_ctx.state === "suspended") _ctx.resume().then(() => console.log("[sara] AudioContext resumido"));
    return _ctx;
  }

  document.body.addEventListener("click", () => { const c = getSharedCtx(); if (c.state === "suspended") c.resume(); }, { once: true });
  textInput.addEventListener("focus", () => getSharedCtx());
  textInput.addEventListener("keydown", () => getSharedCtx());
  micBtn.addEventListener("click", () => getSharedCtx());

  async function ask(text) {
    if (!text || busy) return;
    document.body.classList.add("waiting");
    try { await window.sara.ask(text); } catch {}
    document.body.classList.remove("waiting");
  }

  window.sara.onAudio(({ audioB64, text }) => {
    console.log("[sara] audio recibido:", audioB64?.length);
    if (audioB64) { audioQueue.push({ b64: audioB64, text }); playNext(); }
  });

  async function playNext() {
    if (speakingNow || !audioQueue.length) return;
    speakingNow = true; busy = true; document.body.classList.add("speaking");
    const { b64, text } = audioQueue.shift();
    const subsEl = document.getElementById("subs");
    if (subsEl && text) { subsEl.textContent = text; subsEl.classList.add("show"); }
    try {
      console.log("[sara] decodificando audio...");
      const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
      console.log("[sara] bin size:", bin.byteLength);
      const ctx = getSharedCtx();
      console.log("[sara] ctx state:", ctx.state);
      const buf = await ctx.decodeAudioData(bin);
      console.log("[sara] decode OK, duration:", buf.duration);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.4;
      src.connect(analyser); analyser.connect(ctx.destination);
      const coreEl = document.getElementById("core");
      const data = new Uint8Array(analyser.frequencyBinCount);
      let raf;
      const driveCore = () => {
        analyser.getByteFrequencyData(data);
        let sum = 0; for (let i = 0; i < 24; i++) sum += data[i];
        const v = Math.min(1, (sum / 24) / 140);
        if (coreEl) coreEl.style.transform = `translate(-50%,-50%) scale(${1 + v * 0.3})`;
        raf = requestAnimationFrame(driveCore);
      };
      src.onended = () => { cancelAnimationFrame(raf); if (coreEl) coreEl.style.transform = "";
        speakingNow = false;
        if (audioQueue.length) playNext(); else { document.body.classList.remove("speaking"); busy = false; if (subsEl) subsEl.classList.remove("show"); } };
      src.start(); driveCore();
      console.log("[sara] reproducción iniciada");
      await new Promise((res) => setTimeout(res, buf.duration * 1000 + 150));
    } catch (e) { console.error("[sara] playback ERROR:", e); speakingNow = false;
      if (audioQueue.length) playNext(); else { document.body.classList.remove("speaking"); busy = false; if (subsEl) subsEl.classList.remove("show"); } }
  }

  textInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { const t = textInput.value.trim(); textInput.value = ""; ask(t); } });

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null;
  function startListening() {
    if (!SR) return;
    recog = new SR(); recog.lang = "es-AR"; recog.continuous = true; recog.interimResults = false;
    recog.onresult = (ev) => { let txt = ""; for (let i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) txt += ev.results[i][0].transcript;
      txt = txt.trim().toLowerCase(); if (!txt || busy) return; const hit = ["sara","sarah"].find((w) => txt.includes(w)); if (!hit) return;
      const cmd = txt.slice(txt.indexOf(hit) + hit.length).replace(/^[,\s]+/, ""); try { recog.stop(); } catch {} if (cmd) ask(cmd); };
    recog.onerror = () => {}; recog.onend = () => setTimeout(startListening, 500);
    try { recog.start(); } catch {}
  }
  startListening();

  micBtn.onclick = () => { if (!SR) return; micBtn.classList.add("active"); document.body.classList.add("listening");
    const r = new SR(); r.lang = "es-AR"; r.continuous = false; r.interimResults = false;
    r.onresult = (ev) => { const t = ev.results[0][0].transcript.trim(); ask(t); };
    r.onend = () => { micBtn.classList.remove("active"); document.body.classList.remove("listening"); };
    r.onerror = () => { micBtn.classList.remove("active"); document.body.classList.remove("listening"); }; r.start(); };

  document.querySelectorAll("[data-panel]").forEach((panel) => { const title = panel.querySelector(".panelTitle");
    let sx=0, sy=0, ox=0, oy=0, drag=false;
    title.addEventListener("mousedown", (e) => { if (e.target.dataset.close) return; drag = true; title.classList.add("dragging"); const r = panel.getBoundingClientRect();
      sx = e.clientX; sy = e.clientY; ox = r.left; oy = r.top; panel.style.transform = "none"; panel.style.right = "auto"; panel.style.bottom = "auto"; panel.style.left = r.left + "px"; panel.style.top = r.top + "px"; e.preventDefault(); });
    window.addEventListener("mousemove", (e) => { if (!drag) return; panel.style.left = ox + (e.clientX - sx) + "px"; panel.style.top = oy + (e.clientY - sy) + "px"; });
    window.addEventListener("mouseup", () => { drag=false; title.classList.remove("dragging"); }); });

  document.querySelectorAll(".dot[data-close]").forEach((d) => { d.onclick = () => $(d.dataset.close).style.display = "none"; });

  async function refreshStats() { try { const s = await window.sara.stats(); $("cpuPct").textContent = s.cpuNow ?? "…"; $("cpuBar").style.width = (s.cpuNow ?? 0) + "%";
    $("ramPct").textContent = s.ramUsedPct; $("ramBar").style.width = s.ramUsedPct + "%"; $("ramGb").textContent = s.ramTotalGb; $("upH").textContent = s.uptimeH; $("cores").textContent = s.cores;
    $("tIn").textContent = s.tokens.prompt.toLocaleString(); $("tOut").textContent = s.tokens.completion.toLocaleString(); } catch {} }
  refreshStats(); setInterval(refreshStats, 3000);

  let feedItems = [];
  function renderList(items) { const ul = $("feedList"); ul.innerHTML = ""; if (!items.length) { ul.innerHTML = "<li style='color:rgba(150,200,235,.4)'>sin resultados</li>"; return; }
    items.forEach((it) => { const li = document.createElement("li"); const a = document.createElement("a"); a.textContent = it.title; a.onclick = () => openReader(it.title, it.link); li.appendChild(a); ul.appendChild(li); }); }
  (async () => { feedItems = await window.sara.feed(); if (!feedItems.length) { $("feedList").innerHTML = "<li style='color:rgba(150,200,235,.4)'>sin conexión</li>"; return; } renderList(feedItems); })();

  async function feedSearch() { const q = $("feedSearchInput").value.trim(); if (!q) return; $("feedSearchBtn").textContent = "…";
    const res = await window.sara.search(q); $("feedSearchBtn").textContent = "Ir"; renderList(res.length ? res : [{ title: "sin resultados", link: "" }]); }
  $("feedSearchBtn").onclick = feedSearch;
  $("feedSearchInput").addEventListener("keydown", (e) => { if (e.key === "Enter") feedSearch(); });

  const reader = $("reader"), resultsList = $("resultsList"), articleBody = $("articleBody");
  function openReader(label, url) { if (!url) return; reader.classList.add("open"); $("readerLabel").textContent = label.slice(0, 60) || "Lector";
    articleBody.innerHTML = "<i style='color:rgba(150,200,235,.5)'>cargando…</i>"; resultsList.innerHTML = "";
    window.sara.article(url).then((r) => { if (!r.ok) { articleBody.innerHTML = "No pude cargar (" + r.error + ")."; return; } const t = r.text; articleBody.textContent = "…\n\n" + t.slice(Math.floor(t.length * 0.15)); }); }
  $("readerClose").onclick = () => { reader.classList.remove("open"); articleBody.innerHTML = ""; resultsList.innerHTML = ""; };

  console.log("[sara] lista — escribí o hablale");
  textInput.focus();
</script>
</body>
</html>
